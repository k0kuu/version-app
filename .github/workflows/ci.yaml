name: build-and-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: k0kuu/boobs
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Bump image tag in HelmRelease
        run: |
          cd gitops
          sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|" \
            clusters/dev/version-release.yaml
          git config user.name  "ci-bot"
          git config user.email "ci@noreply.github.com"
          git add clusters/dev/version-release.yaml
          git diff --cached --quiet && echo "no changes" || \
            git commit -m "deploy version-app@${{ github.sha }}"
          git push
